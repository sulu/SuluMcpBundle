services:
  database:
    image: mysql:8.4
    command: ["--max_connections=10000"]
    ports:
      - "${SULU_MCP_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: 'sulu_mcp_test'
      MYSQL_ROOT_PASSWORD: 'ChangeMe'
      MYSQL_ROOT_HOST: '%'
    volumes:
      - sulu-mcp-mysql84-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pChangeMe"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  sulu-mcp-mysql84-data:
