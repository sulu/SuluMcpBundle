framework:
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
    messenger:
        transports:
            sync: 'sync://'
        routing:

# config_admin.yml and config_website.yml both import this file, so it loads
# in both contexts; the website context needs the checker too because
# SuluMcpBundle's ToolPermissionChecker autowires SecurityCheckerInterface
# regardless of context.
sulu_security:
    checker:
        enabled: true

twig:
    paths:
        - '%kernel.project_dir%/templates'

sulu_mcp:
    server_url: 'https://sulu-mcp-server.test'
    oauth:
        access_token_ttl: 3600
        refresh_token_ttl: 2592000
    dangerous_tools:
        delete: true
        publish: true
        block_remove: true

mcp:
    pagination_limit: 100

league_oauth2_server:
    authorization_server:
        private_key: '%kernel.project_dir%/config/jwt/private.pem'
        private_key_passphrase: ~
        encryption_key: 'FunctionalTestSuiteEncryptionKeyNotASecret'
        enable_auth_code_grant: true
        enable_refresh_token_grant: true
    resource_server:
        public_key: '%kernel.project_dir%/config/jwt/public.pem'
    scopes:
        available: ['mcp:tools', 'mcp:resources']
        default: ['mcp:tools', 'mcp:resources']
    persistence:
        in_memory: ~

sulu_article:
    default_main_webspace: website

# SuluPreviewBundle's default kernel factory resolves the project dir by
# walking up from the App\Kernel class file to the nearest composer.json,
# which lands on the bundle root instead of tests/Application. Point it at
# the local PreviewKernel so `cache:warmup`/`cache:clear` (which boot a
# website kernel via CacheCommandSubscriber regardless of console context)
# resolve config from the right place.
services:
    sulu_preview.preview.kernel_factory:
        class: Sulu\Bundle\McpBundle\Tests\Application\PreviewKernelFactory
        arguments:
            - '%kernel.environment%'

    Sulu\Bundle\McpBundle\Tests\Application\DataFixtures\:
        resource: '../DataFixtures/'
        autowire: true
        autoconfigure: true
