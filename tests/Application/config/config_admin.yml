imports:
    - config.yml

framework:
    router: { resource: '%kernel.project_dir%/config/routing_admin.yml' }

security:
    access_decision_manager:
        strategy: unanimous
        allow_if_all_abstain: true

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        sulu:
            id: sulu_security.user_provider

    firewalls:
        assets:
            pattern: ^/(_wdt|_profiler|assets|build)/
            security: false
        mcp:
            pattern: ^/admin/mcp/?$
            provider: sulu
            stateless: true
            entry_point: sulu_mcp.authentication_entry_point
            oauth2: true
        admin:
            pattern: ^/admin(\/|$)
            lazy: true
            provider: sulu
            entry_point: sulu_security.authentication_entry_point
            json_login:
                check_path: sulu_admin.login_check
                success_handler: sulu_security.authentication_handler
                failure_handler: sulu_security.authentication_handler
            logout:
                path: sulu_admin.logout

    access_control:
        - { path: ^/\.well-known/oauth-, roles: PUBLIC_ACCESS }
        - { path: ^/admin/mcp/register$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/mcp/token$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/mcp/?$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/admin/security/reset, roles: PUBLIC_ACCESS }
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/translations, roles: PUBLIC_ACCESS }
        - { path: ^/admin$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/p/, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

        access_decision_manager:
            strategy: affirmative

        providers:
            sulu:
                id: test_user_provider

        firewalls:
            admin:
                http_basic:
                    provider: sulu
