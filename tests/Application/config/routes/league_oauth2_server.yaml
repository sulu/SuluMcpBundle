# Authorize endpoint — behind admin firewall (user must be logged in)
league_oauth2_authorize:
    path: /admin/mcp/authorize
    controller: league.oauth2_server.controller.authorization::indexAction

# Token endpoint — public (authenticated via client credentials)
league_oauth2_token:
    path: /mcp/token
    controller: league.oauth2_server.controller.token::indexAction
    methods: [POST]
