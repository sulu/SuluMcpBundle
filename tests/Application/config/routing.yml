# MCP transport endpoint (/_mcp) - provided by symfony/mcp-bundle
mcp:
    resource: .
    type: mcp

# MCP OAuth endpoints (well-known, authorize)
sulu_mcp:
    resource: '@SuluMcpBundle/config/routes.yaml'
