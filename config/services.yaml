services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        Sulu\Bundle\McpBundle\Application\AdminLink\AdminLinkProviderInterface:
            tags: ['sulu_mcp.admin_link_provider']

    # Admin deeplink registry. Providers need sulu_admin.view_registry, which
    # only exists in the admin container, so they carry the sulu.context: admin
    # tag to be dropped from the website/preview container. The generator is
    # context-agnostic and just gets an empty iterator there.
    Sulu\Bundle\McpBundle\Infrastructure\Symfony\Routing\AdminLinkGenerator:
        arguments:
            $providers: !tagged_iterator sulu_mcp.admin_link_provider
    Sulu\Bundle\McpBundle\Application\AdminLink\AdminLinkGeneratorInterface: '@Sulu\Bundle\McpBundle\Infrastructure\Symfony\Routing\AdminLinkGenerator'

    Sulu\Bundle\McpBundle\Infrastructure\Sulu\AdminLink\PageAdminLinkProvider:
        arguments:
            $viewRegistry: '@sulu_admin.view_registry'
        tags:
            - { name: sulu.context, context: admin }
    Sulu\Bundle\McpBundle\Infrastructure\Sulu\AdminLink\ArticleAdminLinkProvider:
        arguments:
            $viewRegistry: '@sulu_admin.view_registry'
        tags:
            - { name: sulu.context, context: admin }
    Sulu\Bundle\McpBundle\Infrastructure\Sulu\AdminLink\SnippetAdminLinkProvider:
        arguments:
            $viewRegistry: '@sulu_admin.view_registry'
        tags:
            - { name: sulu.context, context: admin }
    Sulu\Bundle\McpBundle\Infrastructure\Sulu\AdminLink\MediaAdminLinkProvider:
        arguments:
            $viewRegistry: '@sulu_admin.view_registry'
        tags:
            - { name: sulu.context, context: admin }
    Sulu\Bundle\McpBundle\Infrastructure\Sulu\AdminLink\TagAdminLinkProvider:
        arguments:
            $viewRegistry: '@sulu_admin.view_registry'
        tags:
            - { name: sulu.context, context: admin }
    Sulu\Bundle\McpBundle\Infrastructure\Sulu\AdminLink\CategoryAdminLinkProvider:
        arguments:
            $viewRegistry: '@sulu_admin.view_registry'
        tags:
            - { name: sulu.context, context: admin }

    # Decorates mcp.registry to drop tools disabled via `dangerous_tools.*`.
    # Attribute discovery would otherwise re-add them after DangerousToolsPass
    # removed the services, and calls would fall through to `new $class()`.
    Sulu\Bundle\McpBundle\Infrastructure\Mcp\FilteredRegistry:
        decorates: mcp.registry
        arguments:
            $inner: '@.inner'
            $visibilityResolver: '@Sulu\Bundle\McpBundle\Application\Security\ToolVisibilityResolver'
            $disabledToolNames: '%sulu_mcp.disabled_tool_names%'

    Sulu\Bundle\McpBundle\Application\Security\ToolPermissionChecker: ~
    Sulu\Bundle\McpBundle\Application\Security\ToolPermissionCheckerInterface: '@Sulu\Bundle\McpBundle\Application\Security\ToolPermissionChecker'
    Sulu\Bundle\McpBundle\Application\Security\WebspacePermissionResolver: ~

    Sulu\Bundle\McpBundle\Application\Security\AccessControlFilterFactory:
        arguments:
            $security: '@security.helper'
            $permissions: '%sulu_security.permissions%'

    # Discovery-layer filtering for tools/list; $contextResolvers is keyed the same
    # way as PermissionAwareCallToolHandler's.
    Sulu\Bundle\McpBundle\Application\Security\ToolVisibilityResolver:
        arguments:
            $permissionMap: '%sulu_mcp.tool_permissions%'
            $contextResolvers:
                sulu_mcp.contact_context_resolver: '@sulu_mcp.contact_context_resolver'
                sulu_mcp.article_context_resolver: '@sulu_mcp.article_context_resolver'
            $allowlist: ['sulu_ping', 'sulu_get_context']

    # Reproduces PageDescendantSecurityListener for the MCP delete tool,
    # which dispatches RemovePageMessage directly and bypasses that route listener.
    Sulu\Bundle\McpBundle\Application\Security\PageDescendantPermissionChecker:
        arguments:
            $pageRepository: '@sulu_page.page_repository'
            $accessControlRepository: '@sulu.repository.access_control'
            $systemStore: '@sulu_security.system_store'
            $security: '@security.helper'
            $permissions: '%sulu_security.permissions%'

    sulu_mcp.contact_context_resolver:
        class: Sulu\Bundle\McpBundle\Infrastructure\Sulu\Security\ContactSecurityContextResolver

    sulu_mcp.article_context_resolver:
        class: Sulu\Bundle\McpBundle\Infrastructure\Sulu\Security\ArticleSecurityContextResolver
        arguments:
            $groupProvider: '@sulu_admin.metadata_group_provider'
    Sulu\Bundle\McpBundle\Infrastructure\Sulu\Security\ArticleSecurityContextResolver: '@sulu_mcp.article_context_resolver'
    Sulu\Bundle\McpBundle\Application\Security\ContentSecurityContextResolver: ~

    # Central fail-closed permission gate: preflight-checks the compile-time
    # permission map before delegating to the SDK's built-in CallToolHandler.
    Sulu\Bundle\McpBundle\Infrastructure\Mcp\PermissionAwareCallToolHandler:
        arguments:
            $registry: '@mcp.registry'
            $referenceHandler: '@sulu_mcp.reference_handler'
            $webspacePermissionResolver: '@Sulu\Bundle\McpBundle\Application\Security\WebspacePermissionResolver'
            $permissionMap: '%sulu_mcp.tool_permissions%'
            $contextResolvers:
                sulu_mcp.contact_context_resolver: '@sulu_mcp.contact_context_resolver'
                sulu_mcp.article_context_resolver: '@sulu_mcp.article_context_resolver'
            $allowlist: ['sulu_ping', 'sulu_get_context']
        tags:
            - { name: mcp.request_handler, priority: 100 }

    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\PingTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\GetContextTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\ContentSearchTool:
        arguments:
            $engine: '@cmsig_seal.engine.default'

    # MCP Resources: discovery layer for AI clients
    Sulu\Bundle\McpBundle\Application\Metadata\FieldValueExampleProvider: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Resource\TemplatesResource:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Resource\BlocksResource:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Resource\WebspacesResource: ~
    Sulu\Bundle\McpBundle\Application\Metadata\ExtensionFieldsProvider:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    # OAuth well-known controller
    Sulu\Bundle\McpBundle\UserInterface\Controller\WellKnownController:
        arguments:
            $serverUrl: '%sulu_mcp.server_url%'
            $mcpPath: '%sulu_mcp.mcp_path%'
            $scopes: '%sulu_mcp.oauth.scopes%'
        tags: ['controller.service_arguments']

    Sulu\Bundle\McpBundle\UserInterface\Controller\DynamicClientRegistrationController:
        arguments:
            $serverUrl: '%sulu_mcp.server_url%'
            $allowedScopes: '%sulu_mcp.oauth.scopes%'
        tags: ['controller.service_arguments']

    Sulu\Bundle\McpBundle\Infrastructure\Symfony\Security\OAuthConsentStore: ~

    Sulu\Bundle\McpBundle\UserInterface\Controller\Admin\OAuthConsentController:
        tags: ['controller.service_arguments']

    Sulu\Bundle\McpBundle\Infrastructure\Sulu\OAuth\SuluUserResolver: ~

    Sulu\Bundle\McpBundle\Infrastructure\Sulu\Admin\OAuthConsentAdmin:
        tags:
            - { name: sulu.context, context: admin }

    # OAuth authorization
    Sulu\Bundle\McpBundle\Infrastructure\League\EventListener\OAuthAuthorizationListener: ~

    # Redirect unauthenticated OAuth-authorize hits to the Sulu admin login
    Sulu\Bundle\McpBundle\Infrastructure\Sulu\Security\EntryPoint\OAuthAuthorizeEntryPoint:
        decorates: sulu_security.authentication_entry_point
        arguments:
            $inner: '@.inner'

    # After admin login, resume a pending /admin/mcp/authorize OAuth request.
    Sulu\Bundle\McpBundle\Infrastructure\Symfony\Security\EventListener\McpLoginSuccessListener: ~

    # MCP event listeners
    Sulu\Bundle\McpBundle\Infrastructure\Symfony\Security\EntryPoint\McpAuthenticationEntryPoint:
        arguments:
            $serverUrl: '%sulu_mcp.server_url%'
            $mcpPath: '%sulu_mcp.mcp_path%'

    # Stable id for the firewall entry_point, so security.yaml never references
    # an internal class name.
    sulu_mcp.authentication_entry_point:
        alias: Sulu\Bundle\McpBundle\Infrastructure\Symfony\Security\EntryPoint\McpAuthenticationEntryPoint
        public: true

    Sulu\Bundle\McpBundle\Infrastructure\Symfony\HttpKernel\EventListener\McpExceptionListener:
        arguments:
            $mcpPath: '%sulu_mcp.mcp_path%'
            $debug: '%kernel.debug%'

    # Forces request format to "json" for MCP requests so Sulu's MarkupBundle
    # response listener does not run the HtmlMarkupParser on JSON-RPC responses
    Sulu\Bundle\McpBundle\Infrastructure\Symfony\HttpKernel\EventListener\McpRequestFormatListener:
        arguments:
            $mcpPath: '%sulu_mcp.mcp_path%'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 64 }

    # Sets Sulu system context for MCP requests so the UserProvider can authenticate OAuth users
    Sulu\Bundle\McpBundle\Infrastructure\Sulu\Security\EventListener\OAuthSystemStoreListener:
        arguments:
            $mcpPath: '%sulu_mcp.mcp_path%'
            $defaultSystem: 'Sulu'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 64 }

    # Commands
    Sulu\Bundle\McpBundle\UserInterface\Command\CreateMcpClientCommand:
        arguments:
            $serverUrl: '%sulu_mcp.server_url%'
            $mcpPath: '%sulu_mcp.mcp_path%'

    # Page read tools
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Page\PageGetTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Page\PageListTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Page\PageTreeTool: ~

    # Page write tools
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Page\PageCreateTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Page\PageUpdateTool: ~

    # Unified content tools (page | article | snippet via `type`)
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Content\ContentDeleteTool: ~  # gated by dangerous_tools.delete
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Content\ContentPublishTool: ~  # gated by dangerous_tools.publish
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Content\ContentUnpublishTool: ~  # gated by dangerous_tools.publish

    # Block management tools
    Sulu\Bundle\McpBundle\Application\Content\ContentTypeResolver: ~
    Sulu\Bundle\McpBundle\Application\Content\ContentMetadataMapper:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\Bundle\McpBundle\Application\Content\BlockDataValidator:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Block\BlockListTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Block\BlockAddTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Block\BlockUpdateTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Block\BlockRemoveTool: ~  # gated by dangerous_tools.block_remove
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Block\BlockReorderTool: ~

    Sulu\Page\Domain\Repository\NavigationRepositoryInterface:
        alias: sulu_page.navigation_repository

    Sulu\Bundle\PreviewBundle\Application\Manager\PreviewLinkManagerInterface:
        alias: sulu_preview.preview_link_manager

    # Article tools
    Sulu\Bundle\McpBundle\Application\Article\ArticleGroupResolver:
        arguments:
            $groupProvider: '@sulu_admin.metadata_group_provider'
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Article\ArticleGetTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Article\ArticleListTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Article\ArticleCreateTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Article\ArticleUpdateTool: ~

    # Taxonomy tools
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Taxonomy\TagCreateTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Taxonomy\TagListTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Taxonomy\TagDeleteTool: ~  # gated by dangerous_tools.delete
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Taxonomy\CategoryCreateTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Taxonomy\CategoryListTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Taxonomy\CategoryDeleteTool: ~  # gated by dangerous_tools.delete

    # Media tools
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Media\MediaListTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Media\MediaGetTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Media\MediaUpdateTool: ~

    # Snippet tools
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Snippet\SnippetGetTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Snippet\SnippetListTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Snippet\SnippetCreateTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Snippet\SnippetUpdateTool: ~

    # Contact tools
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Contact\ContactListTool: ~

    # Navigation tools
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Navigation\NavigationGetTool: ~

    # Preview link tools
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Preview\PreviewLinkGenerateTool: ~
    Sulu\Bundle\McpBundle\UserInterface\Mcp\Tool\Preview\PreviewLinkRevokeTool: ~  # gated by dangerous_tools.publish
