services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        Sulu\Mcp\Application\AdminLink\AdminLinkProviderInterface:
            tags: ['sulu_mcp.admin_link_provider']

    # Providers need sulu_admin.view_registry, which only exists in the admin
    # container, hence the sulu.context tag. The generator itself is
    # context-agnostic and gets an empty iterator elsewhere.
    Sulu\Mcp\Infrastructure\Symfony\Routing\AdminLinkGenerator:
        arguments:
            $providers: !tagged_iterator sulu_mcp.admin_link_provider
    Sulu\Mcp\Application\AdminLink\AdminLinkGeneratorInterface: '@Sulu\Mcp\Infrastructure\Symfony\Routing\AdminLinkGenerator'

    Sulu\Mcp\Infrastructure\Sulu\AdminLink\PageAdminLinkProvider:
        arguments:
            $viewRegistry: '@sulu_admin.view_registry'
        tags:
            - { name: sulu.context, context: admin }
    Sulu\Mcp\Infrastructure\Sulu\AdminLink\ArticleAdminLinkProvider:
        arguments:
            $viewRegistry: '@sulu_admin.view_registry'
        tags:
            - { name: sulu.context, context: admin }
    Sulu\Mcp\Infrastructure\Sulu\AdminLink\SnippetAdminLinkProvider:
        arguments:
            $viewRegistry: '@sulu_admin.view_registry'
        tags:
            - { name: sulu.context, context: admin }
    Sulu\Mcp\Infrastructure\Sulu\AdminLink\MediaAdminLinkProvider:
        arguments:
            $viewRegistry: '@sulu_admin.view_registry'
        tags:
            - { name: sulu.context, context: admin }
    Sulu\Mcp\Infrastructure\Sulu\AdminLink\TagAdminLinkProvider:
        arguments:
            $viewRegistry: '@sulu_admin.view_registry'
        tags:
            - { name: sulu.context, context: admin }
    Sulu\Mcp\Infrastructure\Sulu\AdminLink\CategoryAdminLinkProvider:
        arguments:
            $viewRegistry: '@sulu_admin.view_registry'
        tags:
            - { name: sulu.context, context: admin }

    # Second layer over DangerousToolsPass: refuses disabled tools at registration
    # time, and hides tools the current user's role does not grant from tools/list.
    Sulu\Mcp\Infrastructure\Mcp\FilteredRegistry:
        decorates: mcp.registry
        arguments:
            $inner: '@.inner'
            $visibilityResolver: '@Sulu\Mcp\Application\Security\ToolVisibilityResolver'
            $disabledToolNames: '%sulu_mcp.disabled_tool_names%'

    Sulu\Mcp\Application\Security\ToolPermissionChecker: ~
    Sulu\Mcp\Application\Security\ToolPermissionCheckerInterface: '@Sulu\Mcp\Application\Security\ToolPermissionChecker'
    Sulu\Mcp\Application\Security\WebspacePermissionResolver: ~

    Sulu\Mcp\Application\Security\AccessControlFilterFactory:
        arguments:
            $security: '@security.helper'
            $permissions: '%sulu_security.permissions%'

    # $contextResolvers is keyed the same way as PermissionAwareCallToolHandler's.
    Sulu\Mcp\Application\Security\ToolVisibilityResolver:
        arguments:
            $permissionMap: '%sulu_mcp.tool_permissions%'
            $contextResolvers:
                sulu_mcp.contact_context_resolver: '@sulu_mcp.contact_context_resolver'
                sulu_mcp.article_context_resolver: '@sulu_mcp.article_context_resolver'
            $allowlist: ['sulu_ping', 'sulu_get_context']

    # The MCP delete tool dispatches RemovePageMessage directly, bypassing
    # PageDescendantSecurityListener.
    Sulu\Mcp\Application\Security\PageDescendantPermissionChecker:
        arguments:
            $pageRepository: '@sulu_page.page_repository'
            $accessControlRepository: '@sulu.repository.access_control'
            $systemStore: '@sulu_security.system_store'
            $security: '@security.helper'
            $permissions: '%sulu_security.permissions%'

    sulu_mcp.contact_context_resolver:
        class: Sulu\Mcp\Infrastructure\Sulu\Security\ContactSecurityContextResolver

    sulu_mcp.article_context_resolver:
        class: Sulu\Mcp\Infrastructure\Sulu\Security\ArticleSecurityContextResolver
        arguments:
            $groupProvider: '@sulu_admin.metadata_group_provider'
    Sulu\Mcp\Infrastructure\Sulu\Security\ArticleSecurityContextResolver: '@sulu_mcp.article_context_resolver'
    Sulu\Mcp\Application\Security\ContentSecurityContextResolver: ~

    # Fail-closed gate: checks the compile-time permission map before delegating.
    Sulu\Mcp\Infrastructure\Mcp\PermissionAwareCallToolHandler:
        arguments:
            $registry: '@mcp.registry'
            $referenceHandler: '@sulu_mcp.reference_handler'
            $webspacePermissionResolver: '@Sulu\Mcp\Application\Security\WebspacePermissionResolver'
            $permissionMap: '%sulu_mcp.tool_permissions%'
            $contextResolvers:
                sulu_mcp.contact_context_resolver: '@sulu_mcp.contact_context_resolver'
                sulu_mcp.article_context_resolver: '@sulu_mcp.article_context_resolver'
            $allowlist: ['sulu_ping', 'sulu_get_context']
        tags:
            - { name: mcp.request_handler, priority: 100 }

    Sulu\Mcp\UserInterface\Mcp\Tool\PingTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\GetContextTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\ContentSearchTool:
        arguments:
            $engine: '@cmsig_seal.engine.default'

    # MCP resources
    Sulu\Mcp\Application\Metadata\FieldValueExampleProvider: ~
    Sulu\Mcp\Application\Metadata\FieldNormalizer: ~
    Sulu\Mcp\Application\Metadata\MetadataLocaleResolver:
        arguments:
            $fallbackLocale: '%sulu_core.fallback_locale%'
    Sulu\Mcp\UserInterface\Mcp\Resource\TemplatesResource:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\Mcp\UserInterface\Mcp\Resource\GlobalBlocksResource:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\Mcp\UserInterface\Mcp\Resource\WebspacesResource: ~
    Sulu\Mcp\Application\Metadata\ExtensionFieldsProvider:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\Mcp\UserInterface\Controller\Website\WellKnownController:
        arguments:
            $serverUrl: '%sulu_mcp.server_url%'
            $mcpPath: '%sulu_mcp.mcp_path%'
            $scopes: '%sulu_mcp.oauth.scopes%'
        tags: ['controller.service_arguments']

    Sulu\Mcp\UserInterface\Controller\Admin\DynamicClientRegistrationController:
        arguments:
            $clientSecretHasher: '@league.oauth2_server.password_hasher'
            $allowedScopes: '%sulu_mcp.oauth.scopes%'
        tags: ['controller.service_arguments']

    Sulu\Mcp\Infrastructure\Symfony\Security\OAuthConsentStore: ~

    Sulu\Mcp\UserInterface\Controller\Admin\OAuthConsentController:
        tags: ['controller.service_arguments']

    Sulu\Mcp\Infrastructure\Sulu\Admin\OAuthConsentAdmin:
        tags:
            - { name: sulu.context, context: admin }

    Sulu\Mcp\Infrastructure\League\EventListener\OAuthAuthorizationListener: ~

    Sulu\Mcp\Infrastructure\Sulu\Security\EntryPoint\OAuthAuthorizeEntryPoint:
        decorates: sulu_security.authentication_entry_point
        arguments:
            $inner: '@.inner'

    # After admin login, resume a pending OAuth authorize request.
    Sulu\Mcp\Infrastructure\Symfony\Security\EventListener\McpLoginSuccessListener: ~

    Sulu\Mcp\Infrastructure\Symfony\Security\EntryPoint\McpAuthenticationEntryPoint:
        arguments:
            $serverUrl: '%sulu_mcp.server_url%'
            $mcpPath: '%sulu_mcp.mcp_path%'
            $scopes: '%sulu_mcp.oauth.scopes%'

    # Priority 7: the firewall runs at 8, so the token storage is populated by now.
    Sulu\Mcp\Infrastructure\Symfony\Security\EventListener\McpScopeListener:
        arguments:
            $mcpPath: '%sulu_mcp.mcp_path%'
            $scopes: '%sulu_mcp.oauth.scopes%'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 7 }

    # Stable id so security.yaml never references an internal class name.
    sulu_mcp.authentication_entry_point:
        alias: Sulu\Mcp\Infrastructure\Symfony\Security\EntryPoint\McpAuthenticationEntryPoint
        public: true

    Sulu\Mcp\Infrastructure\Symfony\HttpKernel\EventListener\McpExceptionListener:
        arguments:
            $mcpPath: '%sulu_mcp.mcp_path%'
            $debug: '%kernel.debug%'

    # Keeps Sulu's MarkupBundle from running the HtmlMarkupParser on JSON-RPC
    # responses.
    Sulu\Mcp\Infrastructure\Symfony\HttpKernel\EventListener\McpRequestFormatListener:
        arguments:
            $mcpPath: '%sulu_mcp.mcp_path%'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 64 }

    # Sulu system context, so the UserProvider can authenticate OAuth users.
    Sulu\Mcp\Infrastructure\Sulu\Security\EventListener\OAuthSystemStoreListener:
        arguments:
            $mcpPath: '%sulu_mcp.mcp_path%'
            $defaultSystem: 'Sulu'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 64 }

    # Commands
    Sulu\Mcp\UserInterface\Command\CreateMcpClientCommand:
        arguments:
            $clientSecretHasher: '@league.oauth2_server.password_hasher'
            $serverUrl: '%sulu_mcp.server_url%'
            $mcpPath: '%sulu_mcp.mcp_path%'

    # Page read tools
    Sulu\Mcp\UserInterface\Mcp\Tool\Page\PageGetTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Page\PageListTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Page\PageTreeTool: ~

    # Page write tools
    Sulu\Mcp\UserInterface\Mcp\Tool\Page\PageCreateTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Page\PageUpdateTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Page\PageMoveTool: ~  # gated by dangerous_tools.publish
    Sulu\Mcp\UserInterface\Mcp\Tool\Page\PageReorderTool: ~  # gated by dangerous_tools.publish

    # Unified content tools (page | article | snippet via `type`)
    Sulu\Mcp\UserInterface\Mcp\Tool\Content\ContentDeleteTool: ~  # gated by dangerous_tools.delete
    Sulu\Mcp\UserInterface\Mcp\Tool\Content\ContentPublishTool: ~  # gated by dangerous_tools.publish
    Sulu\Mcp\UserInterface\Mcp\Tool\Content\ContentUnpublishTool: ~  # gated by dangerous_tools.publish

    # Block management tools
    Sulu\Mcp\Application\Content\ContentTypeResolver:
        arguments:
            $productRepository: null  # overridden in services_product.yaml
    Sulu\Mcp\Application\Content\ContentMetadataMapper:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\Mcp\Application\Content\BlockDataValidator:
        arguments:
            $formMetadataProvider: '@sulu_admin.form_metadata_provider'
    Sulu\Mcp\UserInterface\Mcp\Tool\Block\BlockListTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Block\BlockAddTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Block\BlockUpdateTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Block\BlockRemoveTool: ~  # gated by dangerous_tools.block_remove
    Sulu\Mcp\UserInterface\Mcp\Tool\Block\BlockReorderTool: ~

    Sulu\Page\Domain\Repository\NavigationRepositoryInterface:
        alias: sulu_page.navigation_repository

    Sulu\Bundle\PreviewBundle\Application\Manager\PreviewLinkManagerInterface:
        alias: sulu_preview.preview_link_manager

    # Article tools
    Sulu\Mcp\Application\Article\ArticleGroupResolver:
        arguments:
            $groupProvider: '@sulu_admin.metadata_group_provider'
    Sulu\Mcp\UserInterface\Mcp\Tool\Article\ArticleGetTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Article\ArticleListTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Article\ArticleCreateTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Article\ArticleUpdateTool: ~

    # Taxonomy tools
    Sulu\Mcp\UserInterface\Mcp\Tool\Taxonomy\TagCreateTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Taxonomy\TagListTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Taxonomy\TagDeleteTool: ~  # gated by dangerous_tools.delete
    Sulu\Mcp\UserInterface\Mcp\Tool\Taxonomy\CategoryCreateTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Taxonomy\CategoryListTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Taxonomy\CategoryDeleteTool: ~  # gated by dangerous_tools.delete

    # Media tools
    Sulu\Mcp\UserInterface\Mcp\Tool\Media\MediaListTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Media\MediaGetTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Media\MediaUpdateTool: ~

    # Snippet tools
    Sulu\Mcp\UserInterface\Mcp\Tool\Snippet\SnippetGetTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Snippet\SnippetListTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Snippet\SnippetCreateTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Snippet\SnippetUpdateTool: ~

    # Contact tools
    Sulu\Mcp\UserInterface\Mcp\Tool\Contact\ContactListTool: ~

    # Navigation tools
    Sulu\Mcp\UserInterface\Mcp\Tool\Navigation\NavigationGetTool: ~

    # Preview link tools
    Sulu\Mcp\UserInterface\Mcp\Tool\Preview\PreviewLinkGenerateTool: ~
    Sulu\Mcp\UserInterface\Mcp\Tool\Preview\PreviewLinkRevokeTool: ~  # gated by dangerous_tools.publish
