name: Test application (product bundle)

# SuluProductBundle is an optional dependency and cannot be installed by the default
# dependency set: since sulu/SuluProductBundle#407 it requires an unreleased sulu/sulu
# from a fork, and Composer honours a "repositories" entry and an inline alias only in
# the root package. This workflow reproduces that root setup, so the sulu_product_*
# tools and everything gated behind them keep their coverage. Drop the composer config
# step once sulu/sulu#9046 is released and the product bundle points at a tag again.

on:
    pull_request:
    push:
        branches:
            - '[0-9]+.x'
            - '[0-9]+.[0-9]+'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    php:
        name: "PHP ${{ matrix.php-version }} (${{ matrix.dependency-versions }})"
        runs-on: ubuntu-22.04
        timeout-minutes: 30

        env:
            APP_ENV: test
            DATABASE_URL: mysql://root:ChangeMe@127.0.0.1:3306/sulu_mcp_test?serverVersion=8.4&charset=utf8mb4
            # Composer reads COMPOSER_AUTH, not COMPOSER_TOKEN; the vcs repository added
            # below is rate-limited against the GitHub API without it.
            COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

        strategy:
            fail-fast: false
            matrix:
                include:
                    - php-version: '8.2'
                      dependency-versions: 'lowest'
                      php-extensions: 'ctype, iconv, mbstring, sodium, mysql'
                      tools: 'composer:v2'

                    - php-version: '8.4'
                      dependency-versions: 'highest'
                      php-extensions: 'ctype, iconv, mbstring, sodium, mysql'
                      tools: 'composer:v2'

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: ChangeMe
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

        steps:
            - name: Checkout project
              uses: actions/checkout@v4

            - name: Install and configure PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: ${{ matrix.php-extensions }}
                  tools: ${{ matrix.tools }}
                  ini-values: memory_limit=-1
                  coverage: none

            - name: Remove Lint Tools
              # These tools are not required to run tests, so we are removing them to improve dependency resolving and
              # testing lowest versions.
              run: composer remove "*php-cs-fixer*" "*phpstan*" "*rector*" --dev --no-update

            - name: Add the product bundle
              run: .github/scripts/require-product-bundle.sh

            - name: Install composer dependencies
              uses: ramsey/composer-install@v3
              with:
                  dependency-versions: ${{ matrix.dependency-versions }}

            - name: Output versions and installed dependencies
              run: |
                  echo 'PHP Version:'
                  php --version
                  echo ''
                  echo 'Composer Info:'
                  composer info

            - name: Bootstrap test environment
              run: composer bootstrap-test-environment

            - name: Execute test cases
              run: time composer test-with-product

    php-lint:
        name: "PHP Lint"
        runs-on: ubuntu-22.04
        timeout-minutes: 30

        env:
            APP_ENV: test
            DATABASE_URL: mysql://root:ChangeMe@127.0.0.1:3306/sulu_mcp_test?serverVersion=8.4&charset=utf8mb4
            COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: ChangeMe
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

        steps:
            - name: Checkout project
              uses: actions/checkout@v4

            - name: Install and configure PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: 'ctype, iconv, mbstring, sodium, mysql'
                  tools: 'composer:v2'
                  ini-values: memory_limit=-1
                  coverage: none

            - name: Add the product bundle
              run: .github/scripts/require-product-bundle.sh

            - name: Install composer dependencies
              uses: ramsey/composer-install@v3
              with:
                  dependency-versions: 'highest'

            - name: Bootstrap test environment
              run: composer bootstrap-test-environment

            # PHPStan runs here rather than in the default workflow: src/ references
            # SuluProductBundle classes, and analysing without them reports every one of
            # them as an unknown class.
            - name: Lint code
              run: composer lint-with-product
